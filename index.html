<script>
/* tema: auto (segue il dispositivo) | chiaro | scuro */
(function(){
  /* loghi a tema (app + scheda browser): file su GitHub. Icona della Home (apple-touch-icon / manifest): fissa. Per aggiornare i file alza V. */
  var V="3",ICO={dark:{fav:"logo-dark.png",logo:"logo-dark.png"},light:{fav:"logo-light.png",logo:"logo-light.png"}};
  function abs(f){try{return new URL(f+"?v="+V,location.href).href;}catch(e){return f+"?v="+V;}}
  var K="reelax_theme",mq=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
  function pref(){try{var v=localStorage.getItem(K);return v==="light"||v==="dark"?v:"auto";}catch(e){return"auto";}}
  function apply(){
    var p=pref(),t=p==="auto"?(mq&&mq.matches?"light":"dark"):p;
    document.documentElement.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f6f3fb":"#09070f");
    var c=document.querySelector('meta[name="color-scheme"]');if(c)c.setAttribute("content",t);
    var I=ICO[t],f=document.getElementById("fav");
    document.documentElement.style.setProperty("--logo",'url("'+abs(I.logo)+'")');
    if(f){f.setAttribute("type","image/png");f.setAttribute("href",abs(I.fav));}
  }
  window.themePref=pref;
  window.setTheme=function(v){try{if(v==="auto")localStorage.removeItem(K);else localStorage.setItem(K,v);}catch(e){}apply();};
  if(mq){if(mq.addEventListener)mq.addEventListener("change",apply);else if(mq.addListener)mq.addListener(apply);}
  apply();
})();
</script>
<style>
:root{
  --bg:#09070f;--s1:#13101d;--s2:#1a1627;--s3:#262036;

  --soft:rgba(255,255,255,.1);--soft2:rgba(255,255,255,.06);--shade:0,0,0;--bgrgb:9,7,15;--bdb:.6;
  --red:#ff3d52;--vio:#8f62f8;--gold:#f6c653;
  --grad:linear-gradient(135deg,#ff3d52,#c13bd9 62%,#8f62f8);

  --ease:cubic-bezier(.2,.85,.25,1);

}
:root[data-theme="light"]{
  --bg:#f6f3fb;--s1:#efe9f8;--s2:#ffffff;--s3:#e4dcf1;

  --fg:#1a1526;--mut:#675f7d;--dim:#948ba8;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{margin:0;height:100%;font:16px/1.45 var(--fb);color:var(--fg);background:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;border:0;background:none;padding:0}
a{color:inherit;touch-action:manipulation}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sfondo ambientale */
body::before,body::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:110vmax;height:110vmax;border-radius:50%;}
body::before{left:-60vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(143,98,248,.24),transparent)}
body::after{right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.17),transparent)}

/* backdrop sfocato (solo nel risultato) */
#bd{position:absolute;left:0;right:0;top:0;height:62%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
#bd.on{opacity:1}
#bd::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(110px + var(--sat));z-index:2;background:linear-gradient(to bottom,rgb(var(--shade)) 0%,rgba(var(--shade),.6) 40%,transparent 100%)}
#bd i{position:absolute;inset:-10%;background-size:cover;background-position:center top;filter:blur(22px) brightness(var(--bdb));transform:scale(1.2) translateZ(0)}

/* struttura */
#app{position:fixed;left:0;right:0;top:0;bottom:0;z-index:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow-x:clip}
.top{flex:none;padding-top:calc(var(--sat) + 12px);position:relative;z-index:5}
/* barra alta: trasparente, nessun riquadro, un'unica linea continua di progresso */
.top-in{height:52px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 6px}
.slot{display:flex;align-items:center;min-width:0}
.slot.r{justify-content:flex-end;padding-right:12px}
.tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .1s,background .2s}
.tb:active{transform:scale(.88);background:var(--soft)}
.tb svg{width:24px;height:24px}
.brand{display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:.86rem;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em}
.mark{width:22px;height:22px;border-radius:7px;background:#2a1240 var(--logo) center/cover no-repeat;display:grid;place-items:center;box-shadow:0 3px 12px rgba(255,61,82,.45)}
.prog{height:3px;margin:2px var(--gut) 8px;border-radius:3px;background:var(--soft);overflow:hidden;transition:opacity .3s}
.prog.off{opacity:0}
.prog b{display:block;height:100%;width:0;border-radius:inherit;background:var(--grad);box-shadow:0 0 10px rgba(255,61,82,.6);transition:width .65s cubic-bezier(.45,.05,.2,1)}

/* il contenuto sfuma sotto la barra: nessun taglio netto */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px var(--gut) 20px;
  -webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 22px),transparent)}
#stage::-webkit-scrollbar{display:none}
.ghost{position:absolute;z-index:1;box-sizing:border-box;overflow:hidden;padding:10px var(--gut) 20px;pointer-events:none;will-change:transform;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 22px),transparent)}

/* dock inferiore: resta SOPRA la zona della home-indicator, così i tasti si toccano sempre */
#dock{flex:none;position:relative;z-index:6;padding:12px var(--gut) max(16px,calc(var(--sab) + 6px))}
.dock-in{display:flex;gap:8px}
.dock-in .btn{padding:0 6px;font-size:.95rem;border-radius:999px}
.dock-in .btn.v{flex-direction:column;gap:3px;font-size:.8rem;line-height:1.1}
.dock-in .btn.v svg{width:21px;height:21px}
.btn.primary{border-color:transparent;background:var(--grad);background-origin:border-box;color:#fff;box-shadow:0 10px 26px rgba(255,61,82,.3)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 3.8s 1.2s ease-in-out 2;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.btn{position:relative;overflow:hidden;flex:1;min-width:0;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 14px;
  border:1px solid var(--line2);background:var(--s2);font-weight:700;font-size:1rem;white-space:nowrap;text-decoration:none;color:var(--fg);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(1.2)}
.btn svg{width:20px;height:20px;flex:none}
.dock-in:not(.out) .btn{animation:btnIn .42s cubic-bezier(.22,1,.36,1) backwards;animation-delay:.05s}
.dock-in:not(.out) .btn:nth-child(2){animation-delay:.09s}
.dock-in:not(.out) .btn:nth-child(3){animation-delay:.13s}
.dock-in.out{pointer-events:none}
@keyframes btnIn{from{opacity:0;transform:translateY(14px) scale(.96)}}

/* banner installazione (dentro al dock) */
.ib{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--line)}

/* scelta */

.page h1{margin:4px 0 0;flex:none;font-family:var(--fd);font-weight:800;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.02;letter-spacing:-.04em}
/* UN SOLO layout per tutte le domande: elenco a righe che riempie lo schermo */
.opts{flex:1;display:grid;gap:10px;grid-template-columns:1fr;grid-auto-rows:minmax(60px,1fr)}
.opt{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;padding:8px 16px 8px 12px;text-align:left;min-height:60px;
  border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(160deg,var(--s2),var(--s1));transition:transform .1s,border-color .15s,background .15s,box-shadow .2s}
.opt:active{transform:scale(.97)}
.opt .em{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:1.7rem;line-height:1}

.opts.g2{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(104px,1fr);gap:12px}
.opts.g2 .opt{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:14px 10px;border-radius:var(--r3)}

.opts.g2 .opt .tx{flex:none;align-items:center;gap:3px}
.opts.g2 .opt .t{font-size:1.05rem}
.opts.g2 .opt .s{font-size:.76rem}
.segw{flex:none;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translate3d(0,14px,0);pointer-events:none;visibility:hidden;
  transition:opacity .32s ease,transform .45s var(--ease),visibility 0s .45s}
.segw.show{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.seg button:nth-child(2){--n:1}.seg button:nth-child(3){--n:2}
.segw.show .seg button{animation:segIn .45s var(--ease) backwards;animation-delay:calc(.08s + var(--n,0)*55ms)}
@keyframes segIn{from{opacity:0;transform:translate3d(0,10px,0)}}
.segw[hidden]{display:none}
.segq{font:700 .72rem var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);font-weight:700;font-size:.95rem;transition:transform .1s,border-color .15s,background .15s}
.seg button:active{transform:scale(.96)}
.seg button.on{border-color:var(--red);background:linear-gradient(135deg,rgba(255,61,82,.26),rgba(143,98,248,.22));box-shadow:0 0 0 1px var(--red) inset}

/* caricamento / errore */
.load{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.load p{margin:0;font-family:var(--fd);font-weight:700;font-size:1.3rem}
/* caricamento: parete di locandine che scorrono (solo transform/opacity) */
.load{position:relative;overflow:hidden;margin:-10px calc(var(--gut)*-1) -20px;min-height:calc(100% + 30px)}
.load::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(62% 30% at 50% 50%,rgba(var(--bgrgb),.96) 0,rgba(var(--bgrgb),.62) 62%,transparent 100%),linear-gradient(var(--bg),transparent 16%,transparent 84%,var(--bg))}
.load p{position:relative;z-index:2;padding:0 var(--gut);text-shadow:0 2px 20px rgba(0,0,0,.85)}
.wall{position:absolute;left:-30%;right:-30%;top:50%;display:flex;flex-direction:column;gap:12px;pointer-events:none;transform:translate3d(0,-50%,0) rotate(-9deg);animation:wallIn 1.1s var(--ease) backwards}
@keyframes wallIn{from{opacity:0;transform:translate3d(0,-47%,0) rotate(-9deg) scale(1.12)}}
.prow2{flex:none;height:144px}
.ptrack{display:flex;width:max-content;will-change:transform;animation:pmove var(--t,10s) linear var(--o,0s) infinite var(--dir,normal)}
@keyframes pmove{to{transform:translate3d(-50%,0,0)}}
.pc{position:relative;flex:none;width:96px;height:144px;margin-right:12px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,hsl(var(--h) 55% 34%),hsl(calc(var(--h) + 50) 50% 20%));box-shadow:0 8px 20px rgba(0,0,0,.45);}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.pc img.ld{opacity:1}

.err{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.err h2{margin:0;font-family:var(--fd);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.03em}

/* risultato */
.res{display:flex;flex-direction:column;gap:14px;padding-top:2px}

.poster{position:relative;width:min(54vw,224px);aspect-ratio:2/3;border-radius:var(--r2);overflow:hidden;background:var(--s2);border:1px solid var(--line2);cursor:zoom-in;
  box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 40px rgba(143,98,248,.25);touch-action:manipulation;transition:transform .15s}

.poster::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);transform:translateX(-120%);animation:psweep 1.1s .7s ease-out forwards}

.q .poster::before{display:none}

.poster.fb{display:flex;flex-direction:column;justify-content:space-between;padding:.9em;color:#fff;border:0;font-size:16px}

.poster.fb{text-align:center;align-items:center}
.hero h2,.hero .tag,.hero .chips{position:relative;z-index:3}
.hero h2{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(1.7rem,7.5vw,2.3rem);line-height:1.03;letter-spacing:-.035em;word-break:break-word}
.tag{margin:-6px 0 0;font-size:.88rem;color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft2);font-size:.78rem;color:var(--fg);font-weight:600}
.chip.r{color:var(--gold);border-color:rgba(246,198,83,.4)}
.card{padding:16px;border:1px solid var(--line);border-radius:var(--r2);background:linear-gradient(160deg,var(--s2),var(--s1))}
.card h3{margin:0 0 12px;font:700 .7rem var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.card p{margin:0;font-size:.95rem}
@property --f{syntax:'<length>';inherits:false;initial-value:0px}
.card p#plot{overflow:hidden;--f:0px;transition:height .6s cubic-bezier(.25,.8,.25,1),--f .6s ease;
  -webkit-mask-image:linear-gradient(#000 calc(100% - var(--f)),transparent);mask-image:linear-gradient(#000 calc(100% - var(--f)),transparent)}
.card p#plot.clamp{--f:1.6em}
.card.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.card.tap:active{filter:brightness(1.08)}
.card.compat{display:flex;align-items:center;gap:16px}
.ringw{position:relative;flex:none;width:68px;height:68px}

.ringw circle{fill:none;stroke-width:6;stroke-linecap:round}
.ringw .bgc{stroke:rgba(255,255,255,.1)}

.ringw .pn{position:absolute;inset:0;display:grid;place-items:center;font:800 1.05rem var(--fd)}
.compat b{display:block;font:800 1.1rem var(--fd);letter-spacing:-.01em}

.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.why li{display:flex;gap:11px;align-items:flex-start}

/* piattaforme: SOLO icone, sempre su una riga, si rimpiccioliscono per starci */

/* ricerca manuale */
.sin{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;flex:none}

.sres.lib{transition:opacity .2s}.sres.lib.busy{opacity:.45}

@media (min-width:900px){.sres.lib{grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 18px}.bk .t{font-size:.92rem}.bk .s{font-size:.8rem}
  @media (hover:hover){.bk:hover .cv{box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 0 1px var(--line2) inset}.bk:hover{transform:translateY(-3px)}}}
.smsg{margin:10px 0;text-align:center;color:var(--mut);font-size:.9rem}
.pbio:empty{display:none}
.castbtn{display:block;width:100%;text-align:left;cursor:pointer;color:var(--fg)}
.castbtn:active{filter:brightness(1.12)}
.castbtn .cav{display:flex;align-items:center;gap:10px}

/* lightbox locandina */
#lb{position:fixed;inset:0;z-index:100;display:none}

#lb.show .bg{opacity:1}
@property --ms{syntax:'<length>';inherits:false;initial-value:0px}
@property --ml{syntax:'<length>';inherits:false;initial-value:0px}
@property --ma{syntax:'<number>';inherits:false;initial-value:1}

/* accesso */
body.locked #app,body.locked #bd{visibility:hidden}
#lg{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(var(--sat) + 24px) var(--gut) calc(var(--sab) + 24px);
  background:radial-gradient(120% 55% at 50% 38%,rgba(143,98,248,.16),transparent 62%),radial-gradient(90% 50% at 100% 100%,rgba(255,61,82,.14),transparent 60%),var(--bg)}
#lg[hidden]{display:none}
.lgc{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.lgc>*{animation:btnIn .7s cubic-bezier(.22,1,.36,1) backwards}
.lgc>:nth-child(2){animation-delay:.08s}.lgc>:nth-child(3){animation-delay:.14s}.lgc>:nth-child(4){animation-delay:.2s}.lgc>:nth-child(5){animation-delay:.26s}
.lgbrand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:14px;font-family:var(--fd);font-weight:800;font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;text-indent:calc(.22em - 1px)}
.lgbrand .mark{width:64px;height:64px;border-radius:20px}
.lgi{display:block;width:100%;height:56px;border-radius:18px;border:1px solid var(--line2);background:var(--s2);color:var(--fg);font:600 16px var(--fb);padding:0 18px;outline:none;transition:border-color .2s,box-shadow .2s}

function swap(h,anim){
  if(h.indexOf('class="load"')<0)killWall();
  const old=stage.innerHTML,app=$("app");
  document.querySelectorAll(".ghost").forEach(g=>g.remove());
  const dxs=(anim===false)?0:TDX;TDX=0;
  let ghost=null;
  if(dxs&&old.trim()){
    const ar=app.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    ghost=document.createElement("div");ghost.className="ghost";ghost.setAttribute("aria-hidden","true");
    ghost.style.cssText="left:"+(sr.left-ar.left)+"px;top:"+(sr.top-ar.top)+"px;width:"+sr.width+"px;height:"+sr.height+"px";
    ghost.innerHTML=old.replace(/ id="[^"]*"/g,"");
    app.insertBefore(ghost,stage);ghost.scrollTop=stage.scrollTop;
  }
  stage.innerHTML=h;
  if(anim===false)return;
  stage.classList.remove("in");void stage.offsetWidth;stage.classList.add("in");stage.scrollTop=0;
  const E="cubic-bezier(.22,1,.36,1)";
  if(FIRST){   // prima pagina all'apertura: nessuno scorrimento, solo sfocatura incrociata
    FIRST=false;
    if(!RM()&&stage.animate){
      // solo opacity + transform (compositati dalla GPU): niente blur animato, quindi scorre fluido
      const rise=(el,i,y)=>el.animate([{opacity:0,transform:"translate3d(0,"+y+"px,0) scale(.97)"},{opacity:1,transform:"none"}],{duration:1100,delay:120+i*90,easing:E,fill:"backwards"});
      const h1=stage.querySelector("h1");if(h1)rise(h1,0,20);
      stage.querySelectorAll(".opt").forEach((el,i)=>rise(el,i+1,30));
      ["top","dock"].forEach(k=>{const e=k==="top"?document.querySelector(".top"):$("dock");if(e&&e.animate)e.animate([{opacity:0},{opacity:1}],{duration:1000,delay:k==="top"?0:450,easing:"ease-out",fill:"backwards"});});
    }
    return;
  }
  if(!RM()&&stage.animate){
    if(dxs){   // tra due domande: la vecchia sfuma e scivola un poco via, la nuova arriva dalla parte giusta (avanti da destra, indietro da sinistra)
      const D=22,mv=x=>"translate3d("+x+"px,0,0)";
      const h1=stage.querySelector("h1");
      if(h1)h1.animate([{opacity:0,transform:mv(dxs*D)},{opacity:1,transform:"none"}],{duration:320,easing:E,fill:"backwards"});
      stage.querySelectorAll(".opt").forEach((el,i)=>el.animate([{opacity:0,transform:mv(dxs*D)},{opacity:1,transform:"none"}],{duration:340,delay:30+i*28,easing:E,fill:"backwards"}));
      if(ghost){const g=ghost;g.animate([{opacity:1,transform:"none"},{opacity:0,transform:mv(-dxs*D)}],{duration:170,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}).onfinish=()=>g.remove();setTimeout(()=>g.remove(),600);}
    }else stage.animate([{opacity:0,transform:"translate3d(0,10px,0) scale(.99)"},{opacity:1,transform:"none"}],{duration:340,easing:E});
  }else if(ghost)ghost.remove();
}

async function doSearch(q){

/* ---------- Parete di locandine (caricamento) ----------
   RISERVA di WRN=108 locandine già scaricate sul dispositivo (Cache API + elenco in localStorage).
   Ogni muro ne consuma WN=36: quelle usate vengono buttate e al loro posto se ne scaricano altre, in background,
   piano piano e MAI durante il caricamento. Così le locandine sono sempre pronte e sempre nuove. */
const WN=36,WRN=108,WRES="rx_res",WSEEN="rx_seen",WCACHE="rx-wall-v2",PU="https://image.tmdb.org/t/p/w154";
let WRS=[],WSN=[],WURL={},WQ=[],WUSED=[],WPOOL=[],WFILL=null,WLOAD=false,WINIT=false,WPG=0;
try{WRS=JSON.parse(localStorage.getItem(WRES)||"[]");WSN=JSON.parse(localStorage.getItem(WSEEN)||"[]");localStorage.removeItem("rx_wall");localStorage.removeItem("rx_wall2");if(window.caches)caches.delete("rx-wall-v1");}catch(e){}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const wnap=ms=>new Promise(r=>setTimeout(r,ms));
const wsave=()=>{try{localStorage.setItem(WRES,JSON.stringify(WRS));localStorage.setItem(WSEEN,JSON.stringify(WSN.slice(-300)));}catch(e){}};
const wcache=()=>window.caches?caches.open(WCACHE).catch(()=>null):Promise.resolve(null);
const wallUrl=p=>WURL[p]||(PU+p);
async function wallMore(){   // nuovi candidati (mai usati di recente): una pagina TMDB alla volta, film/serie e popolari/più votati alternati
  if(!tmdbOn())return;
  const k=WPG++%4,tv=k%2===1,top=k>1;
  const r=await tm("/3/discover/"+(tv?"tv":"movie"),{sort_by:top?"vote_average.desc":"popularity.desc","vote_count.gte":top?(tv?500:1500):(tv?200:300),include_adult:"false",page:1+rand(top?(tv?8:12):(tv?15:20))}).catch(()=>null);
  ((r&&r.results)||[]).forEach(m=>{const p=m.poster_path;if(p&&WRS.indexOf(p)<0&&WSN.indexOf(p)<0&&WQ.indexOf(p)<0)WQ.push(p);});
}
async function wallDl(p,c){
  try{const r=await fetch(PU+p,{mode:"cors",priority:"low"});if(!r.ok)throw 0;if(c)await c.put(PU+p,r.clone());return true;}
  catch(e){return new Promise(res=>{const im=new Image();im.referrerPolicy="no-referrer";im.fetchPriority="low";im.onload=()=>res(true);im.onerror=()=>res(false);im.src=PU+p;});}   // senza CORS: scalda la cache HTTP
}
function wallFill(){   // porta la riserva a WRN: due locandine alla volta, con pausa; si ferma mentre c'è il caricamento
  return WFILL||(WFILL=(async()=>{
    const c=await wcache();let miss=0;
    while(WRS.length<WRN&&miss<8){
      while(WLOAD&&WRS.length>=WN)await wnap(300);
      if(WQ.length<2){await wallMore();if(!WQ.length){miss++;await wnap(400);continue;}}
      miss=0;
      const b=WQ.splice(0,2),ok=await Promise.all(b.map(p=>wallDl(p,c)));
      b.forEach((p,i)=>{if(ok[i])WRS.push(p);});wsave();
      await wnap(80);
    }
  })().catch(()=>{}).finally(()=>{WFILL=null;}));
}
async function wallPrep(){   // rende pronte (URL locale) le prossime WN locandine
  const c=await wcache();
  for(let i=0,n=0;i<WRS.length&&n<WN;){
    const p=WRS[i];
    if(!WURL[p]){
      try{const r=c&&await c.match(PU+p);
        if(r)WURL[p]=URL.createObjectURL(await r.blob());
        else if(c){WRS.splice(i,1);continue;}
        else WURL[p]=PU+p;
      }catch(e){WURL[p]=PU+p;}
    }
    n++;i++;
  }
}
function wallTake(){   // le prossime WN escono subito dalla riserva: il muro dopo ne userà altre
  const t=WRS.slice(0,WN);WRS=WRS.filter(p=>t.indexOf(p)<0);t.forEach(p=>WSN.push(p));WUSED.push(...t);wsave();return t;
}
async function wallRelease(){   // a transizione finita: butta le usate, prepara le prossime, rifornisce la riserva
  const u=WUSED.splice(0),c=await wcache();
  u.forEach(p=>{if(WURL[p]&&WURL[p].indexOf("blob:")===0)URL.revokeObjectURL(WURL[p]);delete WURL[p];if(c)c.delete(PU+p);});
  await wallPrep();wallFill().then(wallPrep);
}
const wallInit=()=>wallPrep().then(()=>wallFill()).then(wallPrep);
function wallIdle(){if(WINIT)return;WINIT=true;setTimeout(()=>(window.requestIdleCallback?f=>requestIdleCallback(f,{timeout:5000}):f=>f())(wallInit),1500);}
async function wallWait(){for(let i=0;i<20&&WRS.length<WN;i++){if(!WFILL)wallInit();await wnap(300);}}   // solo al primissimo avvio
function wallDims(){   // righe e locandine per riga in base alla finestra: copre sempre tutto lo schermo, con il minimo di elementi
  const big=innerWidth>=900,ph=big?Math.max(170,Math.min(300,innerHeight*.22)):Math.max(140,Math.min(230,innerHeight*.17)),pw=ph*2/3+12;
  return{ph:Math.round(ph),rows:Math.min(9,Math.ceil(innerHeight*1.4/(ph+12))+1),per:Math.min(24,Math.max(9,Math.ceil(innerWidth*1.65/pw)))};
}
function pcHtml(k,hue,d){
  const u=WPOOL.length?wallUrl(WPOOL[k%WPOOL.length]):"";
  return '<i class="pc" data-k="'+k+'" style="--h:'+hue+';--d:'+d+'ms">'+(u?'<img src="'+esc(u)+'" alt="" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" onload="this.classList.add(\'ld\')" onerror="this.remove()">':'')+'</i>';
}
function wallHtml(){
  WPOOL=shuf(wallTake());
  const D=wallDims(),base=rand(2),hue0=rand(360);let k=0,h='<div class="wall" id="wall" aria-hidden="true">';
  for(let r=0;r<D.rows;r++){
    const t=((8+Math.random()*6)*D.per/9).toFixed(2),dir=((r+base)%2)?"reverse":"normal",o=(-Math.random()*t).toFixed(2);
    let set="";

  }
  return h+'</div>';
}
function fillWall(){   // solo al primissimo avvio: le celle vuote ricevono le locandine appena sono pronte
  const w=$("wall");if(!w)return;
  if(!WPOOL.length)WPOOL=shuf(wallTake());
  if(!WPOOL.length)return;
  w.querySelectorAll(".pc").forEach(c=>{
    if(c.querySelector("img"))return;
    const im=new Image();im.decoding="async";im.referrerPolicy="no-referrer";im.fetchPriority="low";im.alt="";
    im.onload=()=>im.classList.add("ld");im.onerror=()=>im.remove();
    im.src=wallUrl(WPOOL[(+c.dataset.k)%WPOOL.length]);c.appendChild(im);
  });

function killWall(now){
  const o=$("ldw");if(!o)return;
  o.removeAttribute("id");const w=o.querySelector("#wall");if(w)w.removeAttribute("id");

function wallOn(){

function loading(){
  setBd(null);
  const t=["Cerco un titolo adatto a te...","Controllo i tuoi gusti...","Ci siamo quasi..."];
  const cancel=()=>{RUN++;home();};

function showError(e){

/* ---------- Fonti dati ---------- */
const KW=/film|serie|anime|televisiv|animazione|manga|telefilm|sitcom/i;
const VALS=l=>l.map(x=>'"'+x+'"@en').join(' ');
function fj(url,ms,opts){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);return fetch(url,Object.assign({signal:c.signal},opts||{})).then(r=>{clearTimeout(t);if(r.status===429){const e=new Error("429");e.retry=1;throw e;}if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).catch(e=>{clearTimeout(t);throw e;});}
const fjr=(url,ms,o)=>fj(url,ms,o).catch(e=>e&&e.retry?sleep(1000).then(()=>fj(url,ms,o)):Promise.reject(e));

const GIT={"Comedy":"Commedia","Drama":"Drammatico","Romance":"Sentimentale","Horror":"Horror","Action":"Azione","Adventure":"Avventura","Fantasy":"Fantasy","Science-Fiction":"Fantascienza","Sci-Fi":"Fantascienza","Mystery":"Mistero","Thriller":"Thriller","Suspense":"Suspense","Slice of Life":"Vita quotidiana","Psychological":"Psicologico","Family":"Famiglia","Crime":"Crimine"};

function fmtMin(m){return m>=60?Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,'0'):""):m+" min";}
const mainstream=m=>m.vc!=null?Math.max(0,Math.min(1,Math.log10(Math.max(10,m.vc))/4.3)):m.sl!=null?Math.max(0,Math.min(1,Math.log10(Math.max(2,m.sl))/2.6)):m.rating?Math.max(0,Math.min(1,(m.rating-4)/5)):.4;

function score(cat,m,a){const g=m.genres||[],gs=G[cat==="cartoni"?(isFilmItem(m)?"film":"serie"):gkey(cat,a)],ms=mainstream(m);return 45*Math.max(hit(g,gs.mood[a.mood]),m.kwm?1:0)+15+20*Math.max(0,1-Math.abs((1-ms)*100-a.risk)/70)+15*(m.sl!=null?ms:m.rating?Math.max(0,Math.min(1,(m.rating-5)/4)):.5)+Math.random()*6;}

/* il tempo/la lunghezza del titolo rientra in ciò che hai scelto? true/false, oppure null se non applicabile o dato mancante */
function timeOk(d,a){
  if(!a||!a.time||a.time==="any")return null;
  if(d.isTv&&S.cat==="anime"){const e=d.episodes;if(!e)return null;return a.time==="short"?e<=13:a.time==="mid"?e<=26:e>26;}
  const t=d.runtime;if(!t)return null;
  if(d.isTv)return a.time==="short"?t<=30:a.time==="mid"?(t>=30&&t<=55):t>=50;
  return a.time==="short"?t<=90:a.time==="mid"?(t>=85&&t<=125):t>=120;
}
/* Compatibilità: deterministica (niente casualità) e spiegabile. 50 = voglia (genere 50, solo parola chiave 42, altrimenti 12),
   30 = epoca e durata rispettate (quelle verificabili), 20 = voto del pubblico. Minimo 35, massimo 99. */
function compat(r){
  const a=S.a,d=r.d,m=r.m,g=m.genres||[],gs=G[S.cat==="cartoni"?(isFilmItem(m)?"film":"serie"):gkey(S.cat,a)];
  const mood=hit(g,gs.mood[a.mood])?50:(m.kwm?42:12),t=[];
  if(a.era&&a.era!=="any"&&d.year)t.push(eraOk(d.year,a));
  const tk=timeOk(d,a);if(tk!==null)t.push(tk);
  const ans=t.length?30*t.filter(Boolean).length/t.length:30;
  const q=d.rv?Math.max(0,Math.min(1,(+d.rv-5)/4)):.5;
  return Math.round(Math.max(35,Math.min(99,mood+ans+20*q)));
}

function parseDur(d){if(!d)return null;const h=/(\d+)\s*hr/.exec(d),m=/(\d+)\s*min/.exec(d);const v=(h?+h[1]*60:0)+(m?+m[1]:0);return v||null;}

  const m=new Map();
  rs.forEach(r=>(r.results||[]).forEach(p=>{
    const raw=String(p.provider_name||"").replace(/\s+Standard with Ads/i," with Ads");
    if(CH_RE.test(raw))return;                       // i "canali" (es. Paramount+ su Prime) sono abbonamenti a parte: li lascio fuori
    const k=provKey(raw);if(!k)return;

    const pr=(p.display_priorities&&p.display_priorities.IT!=null)?p.display_priorities.IT:(p.display_priority!=null?p.display_priority:999);
    const o=m.get(k);
    if(!o)m.set(k,{k:k,n:nm,l:p.logo_path||"",ids:[p.provider_id],pr:pr});

  if(band[1])p["vote_count.lte"]=band[1];

  let kw=kwl.length?uniq(kwl).join("|"):null;

  // se non c'è nulla non ripiego mai su drammatici/commedie qualsiasi: meglio nessun risultato.
  const must=a.mood==="sport"&&useKw;
  if(must&&!kw)throw new Error("EMPTY");   // nessuna parola chiave sportiva risolta su TMDB: nessun ripiego

    :{laugh:[80,9648,10768],love:[80,9648,10768],scare:[35,10751],thrill:[35,10751],mind:[35,10751],sport:[80,9648,10768]};
  const exAll=uniq((MEX[a.mood]||[]).concat(anim?[]:[16])).filter(x=>mood.split("|").indexOf(String(x))<0);
  {const exF=uniq(exAll.concat(AV.g));if(exF.length)p.without_genres=exF.join("|");}
  if(film){
    if(a.time==="short")p["with_runtime.lte"]=90;
    if(a.time==="mid"){p["with_runtime.gte"]=85;p["with_runtime.lte"]=125;}
    if(a.time==="long")p["with_runtime.gte"]=120;
  }else if(!anim){
    if(a.time==="short")p["with_runtime.lte"]=30;

    if(a.time==="long")p["with_runtime.gte"]=50;
  }
  if(a.era&&a.era!=="any"){
    const er=ERA_R[a.era],k=film?"primary_release_date":"first_air_date";

  }

  if(must||p.with_watch_providers){   // Sport / filtro piattaforme: scelgo le pagine a caso su TUTTO l'elenco disponibile (total_pages), così i titoli variano e non si ripetono

  }
  const pages=uniq([1+rand(maxPage),1+rand(maxPage)]);
  let lists=await Promise.all(pages.map(pg=>tm(path,Object.assign({page:pg},p)).then(x=>x.results||[]).catch(()=>null)));
  if(lists.every(x=>x===null))throw new Error("TMDB non raggiungibile"+(LASTERR?" ("+LASTERR+")":""));

      else if(useKw&&kw){const bk=(await Promise.all(KL.b.filter(x=>AV.k.indexOf(x)<0).map(tmKw))).filter(Boolean);wide.with_keywords=uniq(kwl.concat(bk)).join("|");}
      const ex=await Promise.all([1,2,3].map(pg=>tm(path,Object.assign({page:pg},wide)).then(x=>x.results||[]).catch(()=>[])));
      const have={};raw.forEach(m=>{have[m.id]=1;});
      [].concat(...ex).forEach(m=>{if(!have[m.id]){have[m.id]=1;raw.push(m);}});
    }catch(e){}
  }
  const gen=ids=>ja?[].concat(...(ids||[]).map(i=>TM_ANIME[i]||[])):film?(ids||[]).map(i=>TM_FILM[i]).filter(Boolean):[].concat(...(ids||[]).map(i=>TM_TV[i]||[]));
  let base=raw.filter(m=>m.overview&&m.overview.length>25&&(!anim||ja||m.original_language!=="ja"));
  const okEx=base.filter(m=>!(m.genre_ids||[]).some(g=>exAll.indexOf(g)>=0));if(okEx.length>=3)base=okEx;
  if(AV.g.length)base=base.filter(m=>!(m.genre_ids||[]).some(g=>AV.g.indexOf(g)>=0));   // cose da evitare: mai allentate
  const okBand=base.filter(m=>(m.vote_count||0)>=band[0]&&(!band[1]||(m.vote_count||0)<=band[1]));if(okBand.length>=3)base=okBand;
  return base.map(m=>({

const IMGC=new Map();
function preImg(u,ms){
  if(!u)return Promise.resolve();
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    let im=IMGC.get(u);
    if(!im){
      im=new Image();im.decoding="async";im.referrerPolicy="no-referrer";im.src=u;
      IMGC.set(u,im);if(IMGC.size>40)IMGC.delete(IMGC.keys().next().value);   // tengo solo le ultime
    }
    setTimeout(fin,ms||2500);
    if(im.complete&&im.naturalWidth){fin();return;}
    im.addEventListener("load",fin,{once:true});im.addEventListener("error",fin,{once:true});
    if(im.decode)im.decode().then(fin,()=>{});
  });
}

async function run(surprise,fresh){

function openYt(e,key){
  const web="https://www.youtube.com/watch?v="+key,ua=navigator.userAgent||"";
  const android=/android/i.test(ua);
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(android){
    e.preventDefault();
    location.href="intent://www.youtube.com/watch?v="+key+"#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end";
    return;
  }
  if(ios&&navigator.standalone===true){
    e.preventDefault();
    const t=Date.now();
    location.href="youtube://www.youtube.com/watch?v="+key;
    setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500){try{window.open(web,"_blank");}catch(x){}}},1000);
    return;
  }
  /* iOS Safari e desktop: il link https normale (iOS lo passa all'app tramite universal link) */
}

// campiona l'animazione: a ogni istante raggio e cornice sono divisi per la scala, quindi a schermo restano costanti (uguali a locandina piccola)
function kfs(f,t,R,N,edge,clip,opening,M){const o=[];for(let i=0;i<=N;i++){const p=i/N,s=f.s+(t.s-f.s)*p,x=f.x+(t.x-f.x)*p,y=f.y+(t.y-f.y)*p;
  const sm=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v);},q=opening?1-sm(p/.4):sm((p-.6)/.4);
  o.push(edge?{offset:p,boxShadow:"inset 0 0 0 "+(1/s)+"px "+EDGE_C}:{offset:p,transform:"translate("+x+"px,"+y+"px) scale("+s+")",borderRadius:(R/s)+"px",padding:(1/s)+"px",...(M?{"--ms":((M.st-(M.ty+y))/s)+"px","--ml":(14/s)+"px","--ma":1-q}:{}),clipPath:clip?"inset("+[clip.t,clip.r,clip.b,clip.l].map(c=>(c*q/s)+"px").join(" ")+")":"none"});}return o;}
// parte della locandina visibile (tagliata dal contenitore con scroll): la card in animazione deve avere lo stesso taglio
// lo stage sfuma i primi 14px in alto: se la locandina è lì vicino, la card in animazione sfuma allo stesso modo
function fadeM(sr,T){const st=$("stage").getBoundingClientRect().top;return sr.top<st+14?{st:st,ty:T.y}:null;}
function visClip(el,sr){let t=sr.top,b=sr.bottom,l=sr.left,r=sr.right;
  for(let n=el.parentElement;n&&n!==document.documentElement;n=n.parentElement){const cs=getComputedStyle(n);
    if(/(hidden|auto|scroll|clip)/.test(cs.overflowY+cs.overflowX)){const q=n.getBoundingClientRect();t=Math.max(t,q.top);b=Math.min(b,q.bottom);l=Math.max(l,q.left);r=Math.min(r,q.right);}}
  const z=v=>Math.max(0,v);return{t:z(t-sr.top),b:z(sr.bottom-b),l:z(l-sr.left),r:z(sr.right-r)};}

function openLb(el){

  card.style.cssText="left:"+T.x+"px;top:"+T.y+"px;width:"+T.w+"px;height:"+T.h+"px;border-radius:"+R+"px;box-shadow:"+sh;

    card.appendChild(edge);

  el.getAnimations().forEach(x=>x.cancel());
  el.animate([{boxShadow:SH1},{boxShadow:SH0}],{duration:RM()?1:560,easing:"ease-out",fill:"forwards"});
  const D=RM()?1:780;
  const F0={x:sr.left-T.x,y:sr.top-T.y,s:k},F1={x:0,y:0,s:1};
  const VC=visClip(el,sr);
  const oa=card.animate(kfs(F0,F1,R,24,false,VC,true,fadeM(sr,T)),{duration:D,easing:EASE});
  OA=oa;
  if(edge)edge.animate(kfs(F0,F1,R,24,true),{duration:D,easing:EASE});
  if(ring)ring.animate([{opacity:1},{opacity:0,offset:.35},{opacity:0}],{duration:D,easing:"linear",fill:"forwards"});
  try{history.pushState({lb:1},"");}catch(e){}
}
function closeLb(){

function doCloseLb(){
  if(!LB)return;
  const L=LB;LB=null;
  const sr=rectOf(L.el),k=sr.width/L.T.w;
  const cur=L.cur||getComputedStyle(L.card).transform;
  const bg=L.lb.querySelector(".bg");
  L.lb.classList.remove("show");bg.style.opacity="";
  let done=false;
  const fin=()=>{if(done)return;done=true;PEND=null;
    L.el.classList.remove("lbhide");
    try{L.el.getAnimations().forEach(x=>x.cancel());}catch(e){}
    try{L.card.getAnimations().forEach(x=>x.cancel());}catch(e){}
    L.lb.classList.remove("on");L.card.innerHTML="";L.card.style.transform="";};
  const D=RM()?1:640;
  L.el.getAnimations().forEach(x=>x.cancel());
  L.el.animate([{boxShadow:SH0},{boxShadow:SH0,offset:.3},{boxShadow:SH1}],{duration:D,easing:"ease-in-out"});
  let m0;try{m0=new DOMMatrix(cur&&cur!=="none"?cur:"none");}catch(e){m0=new DOMMatrix();}
  const C0={x:m0.e,y:m0.f,s:m0.a||1},C1={x:sr.left-L.T.x,y:sr.top-L.T.y,s:k};
  const VC=visClip(L.el,sr);
  const a=L.card.animate(kfs(C0,C1,L.R,24,false,VC,false,fadeM(sr,L.T)),{duration:D,easing:EASE,fill:"forwards"});
  if(L.ring){L.ring.getAnimations().forEach(x=>x.cancel());L.ring.animate([{opacity:0},{opacity:0,offset:.6},{opacity:1}],{duration:D,easing:"linear",fill:"forwards"});}
  if(L.edge){L.edge.getAnimations().forEach(x=>x.cancel());L.edge.animate(kfs(C0,C1,L.R,24,true),{duration:D,easing:EASE,fill:"forwards"});}
  PEND=fin;a.onfinish=fin;setTimeout(fin,1000);

(function(){
  const lb=$("lb"),card=$("lbc"),bg=lb.querySelector(".bg");

function polish(p,r){

  if(pn){
    if(RM())pn.textContent=p;
    else{const t0=performance.now(),D=950,W=350;(function f(t){const k=Math.max(0,Math.min(1,(t-t0-W)/D)),e=1-Math.pow(1-k,3);pn.textContent=Math.round(p*e);if(t-t0<W+D)requestAnimationFrame(f);else pn.textContent=p;})(t0);}
  }

  [['.chips>*'],['.why li'],['.pv']].forEach(q=>stage.querySelectorAll(q[0]).forEach((el,i)=>el.style.setProperty('--c',i)));
  stage.querySelectorAll('.poster img').forEach(im=>{const ok=()=>im.classList.add('ld');if(im.complete)ok();else{im.addEventListener('load',ok);im.addEventListener('error',ok);}});
  const pe=stage.querySelector('.poster');

  const pl=$('plot'),pm=$('pmore');
  const pc=$('plotcard');
  if(pl&&pm&&pc){
    const cs=getComputedStyle(pl),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5,CH=Math.round(lh*4);
    if(pl.scrollHeight<=CH+2){pl.classList.remove('clamp');pl.style.height='';pm.remove();pc.classList.remove('tap');pc.removeAttribute('role');pc.removeAttribute('tabindex');pc.removeAttribute('aria-expanded');}
    else{
      pl.style.height=CH+'px';
      pl.addEventListener('transitionend',e=>{if(e.target===pl&&e.propertyName==='height'&&!pl.classList.contains('clamp'))pl.style.height='auto';});
      const toggle=()=>{
        if(window.getSelection&&String(window.getSelection()).length>0)return;
        const opening=pl.classList.contains('clamp');
        const cur=pl.getBoundingClientRect().height;
        pl.style.height=cur+'px';void pl.offsetHeight;          // parte da dove si trova ora
        pl.classList.toggle('clamp',!opening);
        pl.style.height=(opening?pl.scrollHeight:CH)+'px';
        pm.textContent=opening?'Riduci':'Leggi tutto';pc.setAttribute('aria-expanded',opening);
      };
      pc.onclick=toggle;
      pc.onkeydown=e=>{if(e.target===pc&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle();}};
    }
  }
}

const EZ="cubic-bezier(.2,.85,.25,1)";
const keyOf=el=>el.tagName+"|"+(el.querySelector&&el.querySelector("h3")?el.querySelector("h3").textContent:el.className);
const smallKey=el=>el.className+"|"+(el.title||el.textContent);
const softIn=(el,delay)=>{if(el.animate)el.animate([{opacity:0,transform:"translate3d(0,8px,0)"},{opacity:1,transform:"none"}],{duration:800,delay:delay||0,easing:EZ,fill:"backwards"});};
function settle(snap){
  const fresh=new Set();
  stage.querySelectorAll('.res>*').forEach(el=>{
    const t=snap.top[keyOf(el)];
    if(t===undefined){fresh.add(el);softIn(el,80);}
    else{const dy=t-el.getBoundingClientRect().top;if(Math.abs(dy)>1&&el.animate)el.animate([{transform:"translate3d(0,"+dy+"px,0)"},{transform:"none"}],{duration:700,easing:EZ});}
  });

    if(snap.small.has(smallKey(el)))return;

  c.classList.remove("busy");btn.disabled=false;er.textContent=fail||"Nome utente o password non corretti.";
  void c.offsetWidth;c.classList.add("bad");$("lgp").value="";try{$("lgp").focus();}catch(x){}
});
/* avvio: aspetta font e primo disegno, poi parte l'animazione (altrimenti scatta mentre la pagina si carica) */
const boot=()=>{document.body.classList.remove("pre");if(isAuthed()){home();syncPull();}else lockApp();};
const fontsOk=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,sleep(1200)]):Promise.resolve();
fontsOk.then(()=>requestAnimationFrame(()=>requestAnimationFrame(boot)));

try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;if(ios&&!stand&&!localStorage.getItem("stasera_ix")){ib.querySelector("p").innerHTML="Per usarla come app: tocca <b>Condividi</b> ⬆️ e poi <b>Aggiungi a Home</b>.";$("ibtn").hidden=true;ib.hidden=false;}}catch(e){}
addEventListener("appinstalled",()=>{ib.hidden=true;});
})();

<script>
/* scorciatoie da tastiera (desktop): ← indietro, → / Invio prossimo, Esc chiude la locandina */
addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target,tag=t&&t.tagName;if(tag==="INPUT"||tag==="TEXTAREA")return;
  var lb=document.getElementById("lb");
  if(e.key==="Escape"&&lb&&lb.classList.contains("on")){var x=document.getElementById("lbx");if(x)x.click();return;}
  if(document.body.classList.contains("locked")||(lb&&lb.classList.contains("on")))return;
  var k=e.key,sel=null;
  if(k==="ArrowLeft"||k==="Backspace")sel='#tl [data-act="back"]';
  else if(k==="ArrowRight")sel='#dockin [data-act="oth"]';
  if(sel){var b=document.querySelector(sel);if(b){e.preventDefault();b.click();}}
});
</script>
