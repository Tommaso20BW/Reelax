<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Reelax: prove di animazione</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#09070f;--s1:#13101d;--s2:#1a1627;--line:rgba(255,255,255,.1);--fg:#f5f1fb;--mut:#a29bb5}
:root[data-theme="light"]{--bg:#f6f3fb;--s1:#efe9f8;--s2:#fff;--line:rgba(30,20,60,.12);--fg:#1a1526;--mut:#675f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Instrument Sans",system-ui,sans-serif;padding:20px 16px 40px;transition:background .4s,color .4s}
.wrap{max-width:720px;margin:0 auto}
h1{font:800 1.6rem "Bricolage Grotesque",sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--s2);border-radius:14px;padding:10px 16px;font-weight:700;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.pri{border-color:transparent;color:#fff;background:linear-gradient(135deg,#ff3d52,#c13bd9 62%,#8f62f8)}
.grid{display:grid;gap:12px}
.card{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer}
.card h3{margin:0;font-size:1rem}
.card p{margin:2px 0 0;color:var(--mut);font-size:.85rem}
.stage{display:flex;justify-content:center;align-items:center;height:90px;margin-top:6px}
.t{font:800 2.1rem/1.2 "Bricolage Grotesque","Arial Narrow",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;color:var(--fg);display:inline-block}
.hint{font-size:.78rem;color:var(--mut);text-align:right;margin-top:-4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Come si anima "Reelax"</h1>
  <p class="sub">Tocca una scheda per rivederla. Dimmi il numero che ti piace.</p>
  <div class="bar"><button class="pri" id="all">Riproduci tutte</button><button id="th">Tema chiaro / scuro</button></div>
  <div class="grid" id="g"></div>
</div>
<script>
const G="linear-gradient(90deg,#ff3d52,#c13bd9,#8f62f8)";
const CL=["#ff3d52","#e63c88","#cd3bbe","#b743df","#a34feb","#8f62f8"];
const OPT=[
 ["Striscia di colore","Una striscia con i colori dei tasti attraversa le lettere da sinistra a destra."],
 ["Riempimento a sfumatura","Le lettere si riempiono di sfumatura da sinistra a destra, poi si svuotano."],
 ["Onda di colore (ferma)","Le lettere restano ferme e si accendono una dopo l'altra, poi si spengono."],
 ["Pulsazione neon","Tutta la scritta si illumina con un alone morbido, poi svanisce."],
 ["Messa a fuoco","Parte sfocata e colorata, poi diventa nitida e torna normale."],
 ["Respiro","Le lettere si allargano un istante mentre si colorano, poi tornano al posto."]
];
const g=document.getElementById("g");
OPT.forEach((o,i)=>{const c=document.createElement("div");c.className="card";c.dataset.a=i+1;
 c.innerHTML='<h3>'+(i+1)+' · '+o[0]+'</h3><p>'+o[1]+'</p><div class="stage"><span class="t">Reelax</span></div><div class="hint">tocca per rivedere</div>';
 c.onclick=()=>play(c);g.appendChild(c);});
function play(card){
  const n=+card.dataset.a,t=card.querySelector(".t");
  t.getAnimations({subtree:true}).forEach(a=>a.cancel());
  t.removeAttribute("style");t.textContent="Reelax";
  const fg=getComputedStyle(t).color;
  const clip=()=>{t.style.webkitBackgroundClip="text";t.style.backgroundClip="text";t.style.webkitTextFillColor="transparent";};
  const reset=a=>a.finished.then(()=>{t.removeAttribute("style");t.textContent="Reelax";},()=>{});
  if(n===1){
    t.style.background="linear-gradient(100deg,"+fg+" 0 38%,#ff3d52 44%,#c13bd9 50%,#8f62f8 56%,"+fg+" 62% 100%) 95% 0/300% 100% no-repeat";clip();
    reset(t.animate([{backgroundPosition:"95% 0"},{backgroundPosition:"5% 0"}],{duration:1200,easing:"ease-in-out"}));
  }
  if(n===2){
    t.style.background=G+" 0 0/0% 100% no-repeat, linear-gradient("+fg+","+fg+") 0 0/100% 100% no-repeat";clip();
    reset(t.animate([
      {backgroundSize:"0% 100%,100% 100%",backgroundPosition:"0 0,0 0"},
      {backgroundSize:"100% 100%,100% 100%",backgroundPosition:"0 0,0 0",offset:.45},
      {backgroundSize:"100% 100%,100% 100%",backgroundPosition:"100% 0,0 0",offset:.62},
      {backgroundSize:"0% 100%,100% 100%",backgroundPosition:"100% 0,0 0"}],{duration:1800,easing:"ease-in-out"}));
  }
  if(n===3){
    const tx=t.textContent;t.textContent="";
    [...tx].forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch;t.appendChild(s);
      const c=CL[Math.min(i,5)];
      s.animate([{color:fg},{color:c,offset:.3},{color:c,offset:.6},{color:fg}],{duration:1300,delay:i*90,easing:"ease-in-out"});});
    setTimeout(()=>{if(!t.getAnimations({subtree:true}).length)t.textContent="Reelax";},1300+6*90+100);
  }
  if(n===4){
    reset(t.animate([
      {color:fg,textShadow:"0 0 0 #c13bd900"},
      {color:"#e04ad8",textShadow:"0 0 18px #c13bd9, 0 0 42px #8f62f866",offset:.4},
      {color:fg,textShadow:"0 0 0 #c13bd900"}],{duration:1500,easing:"ease-in-out"}));
  }
  if(n===5){
    reset(t.animate([
      {filter:"blur(10px)",opacity:.15,color:"#d23ad0"},
      {filter:"blur(0)",opacity:1,color:"#d23ad0",offset:.55},
      {filter:"blur(0)",opacity:1,color:fg}],{duration:1400,easing:"ease-out"}));
  }
  if(n===6){
    reset(t.animate([
      {letterSpacing:".2em",color:fg},
      {letterSpacing:".5em",color:"#c13bd9",offset:.45},
      {letterSpacing:".2em",color:fg}],{duration:1500,easing:"ease-in-out"}));
  }
}
const cards=[...document.querySelectorAll(".card")];
const all=()=>cards.forEach((c,i)=>setTimeout(()=>play(c),i*350));
document.getElementById("all").onclick=all;
document.getElementById("th").onclick=()=>{const h=document.documentElement;h.setAttribute("data-theme",h.getAttribute("data-theme")==="light"?"dark":"light");};
setTimeout(all,500);
</script>
</body>
</html>
