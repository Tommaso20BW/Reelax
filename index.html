<!-- ⚠️ ISTRUZIONI OBBLIGATORIE PER QUALSIASI IA / SVILUPPATORE CHE MODIFICA QUESTO FILE ⚠️
     Valgono SEMPRE, anche se hai solo cercato una riga con grep e non hai letto il resto del file. Se stai per modificare qualsiasi cosa, FERMATI e leggi.

     1. PRIMA di toccare il codice: leggi "VERSIONE E NOVITÀ" (cerca questa scritta, sta sopra settingsPage) e guarda APP_VER e la prima voce di CHANGELOG.
     2. DOPO la modifica: aggiorna APP_VER e CHANGELOG così:
        - una voce per RILASCIO, non per ritocco. Stesso lavoro / stessa giornata della voce in cima -> aggiorna QUELLA, non aggiungerne una nuova.
        - correzione o ritocco piccolo -> terza cifra (2.2 -> 2.2.1) | nuova funzione o schermata -> seconda cifra (2.2 -> 2.3) | cambiamento molto grande -> prima cifra.
        - ogni voce ha v (versione), d (data), t (elenco di novità in italiano, brevi, solo cose che l'utente vede).
     3. NELLA RISPOSTA scrivi sempre una riga: «Versione: X, motivo: …». Anche se non cambi nulla (es. solo commenti): scrivi «Versione invariata, motivo: …».
     4. Non consegnare il file senza aver fatto i punti 1-3. Se non sei sicuro di averli fatti, non hai finito.
     Le stesse regole sono in AGENTS.md / CLAUDE.md nella cartella del progetto. -->

(function(){
  /* loghi a tema (app + scheda browser): file su GitHub. Icona della Home (apple-touch-icon / manifest): fissa. Per aggiornare i file alza V. */
  var V="5",ICO={dark:{fav:"img/favicon.png"},light:{fav:"img/favicon.png"}};
  function abs(f){try{return new URL(f+"?v="+V,location.href).href;}catch(e){return f+"?v="+V;}}
  var K="reelax_theme",mq=window.matchMedia?matchMedia("(prefers-color-scheme: light)"):null;
  function pref(){try{var v=localStorage.getItem(K);return v==="light"||v==="dark"?v:"auto";}catch(e){return"auto";}}
  function meta(){
    var t=document.documentElement.getAttribute("data-theme");
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f5f5f6":"#0b0b0d");
    var c=document.querySelector('meta[name="color-scheme"]');if(c)c.setAttribute("content",t);
  }
  function apply(defer){
    var p=pref(),t=p==="auto"?(mq&&mq.matches?"light":"dark"):p;
    document.documentElement.setAttribute("data-theme",t);
    if(defer!==true)meta();
    var I=ICO[t],f=document.getElementById("fav");
    if(f){f.setAttribute("type","image/png");f.setAttribute("href",abs(I.fav));}
  }
  window.themePref=pref;
  window.setTheme=function(v){
    var h=document.documentElement;
    h.classList.add("tt");clearTimeout(window._tt);window._tt=setTimeout(function(){h.classList.remove("tt");},800);
    try{if(v==="auto")localStorage.removeItem(K);else localStorage.setItem(K,v);}catch(e){}
    apply();
  };
  if(mq){if(mq.addEventListener)mq.addEventListener("change",apply);else if(mq.addListener)mq.addListener(apply);}
  apply();
})();
</script>

.card{padding:16px;border:1px solid var(--line);border-radius:var(--r2);background:linear-gradient(160deg,var(--s2),var(--s1))}

@property --f{syntax:'<length>';inherits:false;initial-value:0px}

.ringw{position:relative;flex:none;width:68px;height:68px}

.attr{margin:0;font-size:min(.62rem,calc((100vw - 52px)/44));line-height:1.5;color:var(--mut);opacity:.65;text-align:center;padding:2px 0 8px}

/* ricerca manuale */
.sin{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;flex:none}

@media (min-width:560px){.sres.lib{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:900px){.sres.lib{grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 18px}.bk .t{font-size:.92rem}.bk .s{font-size:.8rem}
  @media (hover:hover){.bk:hover .cv{box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 0 1px var(--line2) inset}.bk:hover{transform:translateY(-3px)}}}
.smsg{margin:10px 0;text-align:center;color:var(--mut);font-size:.9rem}
.pbio:empty{display:none}
.castbtn{display:block;width:100%;text-align:left;cursor:pointer;color:var(--fg)}

.sgm{display:block;position:relative;height:200px;margin-top:6px;overflow:hidden;--fw:40px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fw),#000 calc(100% - var(--fw)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fw),#000 calc(100% - var(--fw)),transparent 100%)}
.sgi{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,.05,.2,1),opacity .9s ease;will-change:transform,opacity}

.sgd{position:absolute;left:0;right:0;bottom:0;text-align:center;padding:0 6px;z-index:2;pointer-events:none}
.sgd b{display:block;font-weight:800;font-size:.9rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;overflow-wrap:anywhere}

@media (min-width:900px){.sgd b{font-size:1.05rem}.sgd i{font-size:.84rem}}

.q .res>*,.q .chip,.q .why li,.q .pv{animation:none!important}

/* lightbox locandina */
#lb{position:fixed;inset:0;z-index:100;display:none}
#lb.on{display:block}
#lb .bg{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .6s ease;will-change:opacity;overflow:hidden}
#lb.show .bg{opacity:1}
/* sfondo: la locandina stessa, sfocata. Scuro nel tema scuro, chiaro nel tema chiaro; si ingrandisce piano mentre appare */
#lb .bg i{position:absolute;inset:-6%;transform:scale(1.22) translateZ(0);transition:transform 1.2s cubic-bezier(.2,.85,.25,1);will-change:transform;backface-visibility:hidden}
#lb.show .bg i{transform:scale(1.08) translateZ(0)}
#lb .bg i canvas{display:block;width:100%;height:100%;object-fit:cover}
#lb .bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,.7)}
:root[data-theme="light"] #lb .bg::after{background:rgba(255,255,255,.6)}
@property --ms{syntax:'<length>';inherits:false;initial-value:0px}
@property --ml{syntax:'<length>';inherits:false;initial-value:0px}
@property --ma{syntax:'<number>';inherits:false;initial-value:1}
#lb .card2{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:var(--r2);overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 40px rgba(143,98,248,.25);touch-action:none;will-change:transform,border-radius;isolation:isolate;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-mask-image:linear-gradient(rgba(0,0,0,var(--ma)) var(--ms),#000 calc(var(--ms) + var(--ml)));mask-image:linear-gradient(rgba(0,0,0,var(--ma)) var(--ms),#000 calc(var(--ms) + var(--ml)))}
#lb .card2 img{width:100%;height:100%;object-fit:cover}
#lb .card2 .poster{width:100%;height:100%;border-radius:0;box-shadow:none;cursor:default;border:0}
.poster.lbhide{background:transparent!important;border-color:transparent!important}
.poster.lbhide>:not(.rate){visibility:hidden}
.poster.lbhide::before{visibility:hidden}   /* NON display:none: ritogliendola l'animazione "psweep" ripartiva e rifaceva passare la riga bianca */
#lb .card2 .poster::before{display:none}
#lb .x{position:absolute;top:calc(var(--sat) + 12px);right:14px;opacity:0;transition:opacity .5s .2s}
#lb.show .x{opacity:1}
#lb .hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);text-align:center;font-size:.8rem;color:var(--mut);opacity:0;transition:opacity .5s .3s}
#lb.show .hint{opacity:1}

/* solo verticale su smartphone: in orizzontale (schermo touch basso) una schermata copre l'app e chiede di raddrizzare il telefono */
#rot{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--fg);text-align:center;padding:24px;font-weight:700;font-size:1rem;-webkit-user-select:none;user-select:none}
#rot svg{width:54px;height:54px;color:var(--mut);animation:rotTilt 2.4s cubic-bezier(.45,.05,.2,1) infinite}
@keyframes rotTilt{0%,25%{transform:rotate(-90deg)}60%,100%{transform:none}}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none;transform:none}}

/* accesso */
body.locked #app,body.locked #bd{visibility:hidden}
#lg{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(var(--sat) + 24px) var(--gut) calc(var(--sab) + 24px);
  background:var(--bg)}
#lg[hidden]{display:none}

.lgc{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.lgc>*{animation:btnIn .7s cubic-bezier(.22,1,.36,1) backwards}
.lgc>:nth-child(2){animation-delay:.08s}.lgc>:nth-child(3){animation-delay:.14s}.lgc>:nth-child(4){animation-delay:.2s}.lgc>:nth-child(5){animation-delay:.26s}
/* scritta REELAX del login: una sola parola (non lettere separate); entra tutta insieme, poi un unico gradiente dell'app (rosso, viola, blu) scorre sull'intera scritta */
.lgword{display:flex;justify-content:center;margin-bottom:24px;padding-left:.2em;font-family:var(--fd);font-weight:800;font-size:2.1rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.2;-webkit-user-select:none;user-select:none;animation:lgwIn .9s var(--ease) .1s backwards}
.lgword span{display:block;color:#c13bd9;background:linear-gradient(90deg,#ff3d52 0%,#c13bd9 25%,#8f62f8 50%,#c13bd9 75%,#ff3d52 100%) 0 50%/200% 100% repeat-x}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.lgword span{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;animation:lgwFlow 5s linear infinite}}
@keyframes lgwIn{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes lgwFlow{to{background-position:200% 50%}}
.lgi{display:block;width:100%;height:56px;border-radius:18px;border:1px solid var(--line2);background:var(--s2);color:var(--fg);font:600 16px var(--fb);padding:0 18px;outline:none;transition:border-color .2s,box-shadow .2s}
.lgi:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(143,98,248,.25)}
.lgi::placeholder{color:var(--dim);font-weight:500}
.lgerr{margin:0;min-height:1.3em;text-align:center;font-size:.86rem;color:var(--red)}
#lg .btn{flex:none;width:100%}
#lg .btn:disabled{opacity:.6}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.lgc.bad .lgi{animation:shake .45s ease;border-color:var(--red)}
/* sfondo del login: stessi aloni dell'app (body::before/::after), così segue il tema chiaro e scuro */
.lgbg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.lgbg i{position:absolute;width:110vmax;height:110vmax;border-radius:50%}
.lgbg i:nth-child(1){left:-60vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(255,61,82,.07),transparent)}
.lgbg i:nth-child(2){right:-60vmax;bottom:-75vmax;background:radial-gradient(closest-side,rgba(255,61,82,.07),transparent)}
.lgbg i:nth-child(3){display:none}
:root[data-theme="light"] .lgbg i{opacity:.18}
:root:not([data-theme="light"]) .lgbg i:nth-child(1){background:radial-gradient(closest-side,rgba(255,255,255,.05),transparent)}
:root:not([data-theme="light"]) .lgbg i:nth-child(2){background:radial-gradient(closest-side,rgba(255,255,255,.035),transparent)}
.lgc{position:relative;z-index:1}

/* logo: leggero galleggiamento; durante l'accesso pulsa con un anello che si espande */
.lgc>*{position:relative;z-index:1}
/* sfondo dell'app: le due luci si muovono piano */
/* aloni di sfondo fermi: animarli rallentava tutto il sito */
body.pre #app{opacity:0}
/* schermata di avvio: stessa grafica dell'immagine di iOS (sfondo sfumato + sola scritta), poi sfuma verso login o app */
#sp{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background-color:#b3306f;background-image:linear-gradient(135deg,#d8304a,#9d2fb0 62%,#6f4bd1)}
#sp[hidden]{display:none}
#sp svg{display:block;width:min(56vw,320px);height:auto;overflow:visible;fill:#fff}
#sp path{transform-box:fill-box;transform-origin:50% 50%}
@keyframes spw{0%,100%{opacity:1}50%{opacity:.62}}
#sp.wait path{animation:spw 2.2s ease-in-out infinite}
#sp.wait path:nth-child(2){animation-delay:.14s}#sp.wait path:nth-child(3){animation-delay:.28s}#sp.wait path:nth-child(4){animation-delay:.42s}#sp.wait path:nth-child(5){animation-delay:.56s}#sp.wait path:nth-child(6){animation-delay:.7s}
@media (prefers-reduced-motion:reduce){#sp.wait path{animation:none}}

/* animazioni */
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes chipIn{from{opacity:0;transform:translate3d(0,8px,0)}}
@keyframes sel{0%{box-shadow:0 0 0 0 rgba(255,61,82,.55)}100%{box-shadow:0 0 0 16px rgba(255,61,82,0)}}
.opt.hit{animation:sel .5s ease-out}
.in .res>*{animation:chipIn .8s var(--ease) backwards;animation-delay:calc(var(--k,0)*70ms + 40ms)}
.in .tag{animation:chipIn .8s var(--ease) backwards;animation-delay:.22s}
.in .chip{animation:chipIn .8s var(--ease) backwards;animation-delay:calc(.3s + var(--c,0)*60ms)}
.in .why li{animation:chipIn .8s var(--ease) backwards;animation-delay:calc(.4s + var(--c,0)*90ms)}
.in .pv{animation:chipIn .8s var(--ease) backwards;animation-delay:calc(.3s + var(--c,0)*45ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

@media (min-width:900px) and (min-height:560px){
  :root{--gut:40px;--pgb:10px}

  .dock-in{max-width:720px;margin:0 auto}
  .btn{height:60px}
  @media (hover:hover){.btn:hover{filter:brightness(1.15)}.tb:hover{background:var(--soft)}.poster:hover{transform:scale(1.02)}.card.tap:hover,.castbtn:hover{filter:brightness(1.1)}.sr:hover{border-color:var(--line2)}}

  /* domande: titolo centrato e opzioni in griglia larga */
  .page{--pg:34px;justify-content:center;max-width:1320px;margin:0 auto;width:100%}
  .page h1{text-align:center;font-size:clamp(2.6rem,4.2vw,3.6rem);margin:0}
  .opts{flex:none}
  .opts.g2{gap:18px;grid-auto-rows:minmax(168px,auto)}
  .opts.g2.n4{grid-template-columns:repeat(4,1fr)}
  .opts.g2.n6{grid-template-columns:repeat(3,1fr)}
  .opts.g2 .opt{padding:22px 14px;gap:12px}
  .opts.g2 .opt .em{font-size:3.2rem}
  .opts.g2 .opt .t{font-size:1.2rem}
  .opts.g2 .opt .s{font-size:.86rem}
  .segw{align-items:center}
  .seg{width:100%;max-width:520px}

  /* ricerca, cast e altre pagine senza opzioni: colonna centrata */
  .page:not(:has(.opts)){max-width:1100px;justify-content:flex-start}
  .page:not(:has(.opts)) h1{text-align:left}
  .page:has(.lib){max-width:1600px}

  /* risultato: locandina a sinistra (fissa), schede a destra */
  .res{display:grid;grid-template-columns:420px minmax(0,1fr);grid-template-rows:repeat(12,auto) 1fr;column-gap:64px;row-gap:0;align-items:start;max-width:1440px;margin:0 auto;padding-top:6px}
  .res>*{grid-column:2;margin-bottom:14px}
  .res>.hero{grid-column:1;grid-row:1/-1;position:sticky;top:6px;margin:0}
  /* la locandina si adatta all'altezza disponibile: locandina, titolo e chip restano sempre visibili senza scorrere (barra alta + dock + titolo + chip ≈ 450px, con margine per titoli lunghi) */
  .poster{width:min(100%,400px,max(90px,calc((100vh - 260px)*2/3)))}
  @supports (height:100dvh){.poster{width:min(100%,400px,max(90px,calc((100dvh - 260px)*2/3)))}}

    const ar=app.getBoundingClientRect(),sr=stage.getBoundingClientRect();

    ghost.style.cssText="left:"+(sr.left-ar.left)+"px;top:"+(sr.top-ar.top)+"px;width:"+sr.width+"px;height:"+sr.height+"px";
    {const cs=getComputedStyle(stage);ghost.style.padding=cs.paddingTop+" "+cs.paddingRight+" "+cs.paddingBottom+" "+cs.paddingLeft;const mk=cs.webkitMaskImage&&cs.webkitMaskImage!=="none"?cs.webkitMaskImage:cs.maskImage;if(mk&&mk!=="none"){ghost.style.webkitMaskImage=mk;ghost.style.maskImage=mk;}}   // stesso padding dello stage: il contenuto non si sposta di qualche pixel nel passaggio

      stage.querySelectorAll(".opt").forEach((el,i)=>el.animate([{opacity:0,transform:mv(dxs*D)},{opacity:1,transform:"none"}],{duration:340,delay:30+i*28,easing:E,fill:"backwards"}));

  }
}

/* ---------- Parete di locandine (caricamento) ----------
   RISERVA di WRN=108 locandine già scaricate sul dispositivo (Cache API + elenco in localStorage).
   Ogni muro ne consuma WN=36: quelle usate vengono buttate e al loro posto se ne scaricano altre, in background,
   piano piano e MAI durante il caricamento. Così le locandine sono sempre pronte e sempre nuove. */
const WN=36,WRN=108,WRES="rx_res",WSEEN="rx_seen",WCACHE="rx-wall-v2",PU="https://image.tmdb.org/t/p/w154";
let WRQ=0,WRS=[],WSN=[],WURL={},WQ=[],WUSED=[],WPOOL=[],WFILL=null,WLOAD=false,WINIT=false,WPG=0;
try{WRS=JSON.parse(localStorage.getItem(WRES)||"[]");WSN=JSON.parse(localStorage.getItem(WSEEN)||"[]");localStorage.removeItem("rx_wall");localStorage.removeItem("rx_wall2");if(window.caches)caches.delete("rx-wall-v1");}catch(e){}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const wnap=ms=>new Promise(r=>setTimeout(r,ms));
const wsave=()=>{try{localStorage.setItem(WRES,JSON.stringify(WRS));localStorage.setItem(WSEEN,JSON.stringify(WSN.slice(-300)));}catch(e){}};
const wcache=()=>window.caches?caches.open(WCACHE).catch(()=>null):Promise.resolve(null);
const wallUrl=p=>WURL[p]||(PU+p);
async function wallMore(){   // nuovi candidati (mai usati di recente): una pagina TMDB alla volta, film/serie e popolari/più votati alternati
  if(!tmdbOn())return;
  const k=WPG++%4,tv=k%2===1,top=k>1;
  const r=await tm("/3/discover/"+(tv?"tv":"movie"),{sort_by:top?"vote_average.desc":"popularity.desc","vote_count.gte":top?(tv?500:1500):(tv?200:300),include_adult:"false",page:1+rand(top?(tv?8:12):(tv?15:20))}).catch(()=>null);
  ((r&&r.results)||[]).forEach(m=>{const p=m.poster_path;if(p&&WRS.indexOf(p)<0&&WSN.indexOf(p)<0&&WQ.indexOf(p)<0)WQ.push(p);});
}
async function wallDl(p,c){
  try{const r=await fetch(PU+p,{mode:"cors",priority:"low"});if(!r.ok)throw 0;if(c)await c.put(PU+p,r.clone());return true;}
  catch(e){return new Promise(res=>{const im=new Image();im.referrerPolicy="no-referrer";im.fetchPriority="low";im.onload=()=>res(true);im.onerror=()=>res(false);im.src=PU+p;});}   // senza CORS: scalda la cache HTTP
}
function wallFill(){   // porta la riserva a WRN: due locandine alla volta, con pausa; si ferma mentre c'è il caricamento
  return WFILL||(WFILL=(async()=>{
    const c=await wcache();let miss=0;
    while(WRS.length<WRN&&miss<8){
      while(WLOAD&&WRS.length>=WN)await wnap(300);
      if(WQ.length<2){await wallMore();if(!WQ.length){miss++;await wnap(400);continue;}}
      miss=0;
      const b=WQ.splice(0,2),ok=await Promise.all(b.map(p=>wallDl(p,c)));
      b.forEach((p,i)=>{if(ok[i])WRS.push(p);});wsave();
      await wnap(80);
    }
  })().catch(()=>{}).finally(()=>{WFILL=null;}));
}
async function wallPrep(){   // rende pronte (URL locale) le prossime WN locandine
  const c=await wcache();
  for(let i=0,n=0;i<WRS.length&&n<WN;){
    const p=WRS[i];
    if(!WURL[p]){
      try{const r=c&&await c.match(PU+p);
        if(r){const bl=await r.blob();if(!WURL[p])WURL[p]=URL.createObjectURL(bl);}   // controllo dopo l'attesa: chiamate in parallelo non creano due URL per la stessa locandina
        else if(c){WRS.splice(i,1);continue;}
        else WURL[p]=PU+p;
      }catch(e){WURL[p]=PU+p;}
    }
    n++;i++;
  }
}
function wallTake(){   // le prossime WN escono subito dalla riserva: il muro dopo ne userà altre
  const t=WRS.slice(0,WN);WRS=WRS.filter(p=>t.indexOf(p)<0);t.forEach(p=>WSN.push(p));WUSED.push(...t);wsave();return t;
}
async function wallRelease(){   // a transizione finita: butta le usate, prepara le prossime, rifornisce la riserva
  if(document.querySelector(".ldw")){if(!WRQ){WRQ=1;setTimeout(()=>{WRQ=0;wallRelease();},1500);}return;}   // un muro è ancora a schermo (o ne è partito un altro): le sue locandine non si toccano
  const keep=WPOOL,u=WUSED.filter(p=>keep.indexOf(p)<0);WUSED=WUSED.filter(p=>keep.indexOf(p)>=0);   // il pool in uso resta valido finché non viene sostituito
  const c=await wcache();
  u.forEach(p=>{if(WURL[p]&&WURL[p].indexOf("blob:")===0)URL.revokeObjectURL(WURL[p]);delete WURL[p];if(c)c.delete(PU+p);});
  await wallPrep();wallFill().then(wallPrep);
}
const wallInit=()=>wallPrep().then(()=>wallFill()).then(wallPrep);
function wallIdle(){if(WINIT)return;WINIT=true;setTimeout(()=>(window.requestIdleCallback?f=>requestIdleCallback(f,{timeout:5000}):f=>f())(wallInit),1500);}
async function wallWait(){for(let i=0;i<20&&WRS.length<WN;i++){if(!WFILL)wallInit();await wnap(300);}}   // solo al primissimo avvio
function wallDims(){   // righe e locandine per riga in base alla finestra: copre sempre tutto lo schermo, con il minimo di elementi
  const big=innerWidth>=900,ph=big?Math.max(170,Math.min(300,innerHeight*.22)):Math.max(140,Math.min(230,innerHeight*.17)),pw=ph*2/3+12;
  return{ph:Math.round(ph),rows:Math.min(9,Math.ceil(innerHeight*1.4/(ph+12))+1),per:Math.min(24,Math.max(9,Math.ceil(innerWidth*1.65/pw)))};
}

   if(rdy||!WPOOL.length)WPOOL=shuf(wallTake());}

function loading(){

  let canc=false;

  const out={ch:[],push:false};
  j=j&&typeof j==="object"?j:{};
  const rs=(j.st&&typeof j.st==="object"&&!Array.isArray(j.st))?j.st:{},rt=(rs._t&&typeof rs._t==="object")?rs._t:{},lt=stT();
  const lrg=()=>{if(REGIONS.indexOf(L.rg)>=0)return L.rg;try{const v=localStorage.getItem(RGKEY);if(REGIONS.indexOf(v)>=0&&v!=="IT")return v;}catch(e){}return undefined;};
  const rget=k=>k==="pf"?j.pf:k==="rg"?j.rg:k==="platforms"?j.platforms:rs[k];
  const lget=k=>k==="pf"?(typeof L.pf==="boolean"?L.pf:undefined):k==="rg"?lrg():k==="platforms"?((L.platforms.length||lt.platforms)?L.platforms:undefined):(L.st?L.st[k]:undefined);
  const ok=(k,v)=>v!==undefined&&(k==="pf"?typeof v==="boolean":k==="rg"?REGIONS.indexOf(v)>=0:k==="platforms"?Array.isArray(v):true);
  const put=(k,v)=>{
    if(k==="pf"){L.pf=v;try{localStorage.setItem(PFKEY,v?"1":"0");}catch(e){}}
    else if(k==="rg"){L.rg=v;try{localStorage.setItem(RGKEY,v);}catch(e){}}
    else if(k==="platforms")L.platforms=v;
    else{if(!L.st||typeof L.st!=="object")L.st={};L.st[k]=v;}
  };
  const keys=new Set(["pf","rg","platforms"]);
  [rs,L.st].forEach(o=>{if(o&&typeof o==="object")Object.keys(o).forEach(k=>{if(k!=="_t")keys.add(k);});});
  keys.forEach(k=>{
    const r=rget(k),l=lget(k),rts=+rt[k]||0,lts=+lt[k]||0;
    if(ok(k,r)&&rts>=lts){
      if(JSON.stringify(r)!==JSON.stringify(l)){put(k,r);out.ch.push(k);}
      if(rts)lt[k]=rts;
    }else if(l!==undefined)out.push=true;   // il server non la conosce oppure la mia modifica e' piu' recente
  });
  return out;
}
function afterSettings(ch){

}
async function syncPush(){
  if(!tmdbOn()||!getTok())return;
  try{

      const g=await fetch(PX()+"/me/lists",{headers:AUTHH()});
      if(g.status===401){doLogout();return;}
      if(g.ok){const m=mergeSettings(await g.json());if(m.ch.length)afterSettings(m.ch);}
    }catch(e){}
    const r=await fetch(PX()+"/me/lists",{method:"PUT",headers:AUTHH(),body:JSON.stringify(L)});
    if(r.status===401){doLogout();return;}
    if(r.ok)try{localStorage.removeItem(LDIRTY);}catch(e){}
  }catch(e){}
}
async function syncPull(){
  if(!tmdbOn()||!getTok())return;
  try{if(localStorage.getItem(LDIRTY)==="1")return syncPush();}catch(e){}   // modifiche locali non ancora inviate: si inviano prima
  const ts0=L.ts;
  try{
    const r=await fetch(PX()+"/me/lists",{headers:AUTHH()});
    if(r.status===401){doLogout();return;}
    if(!r.ok)return;
    const j=await r.json();
    if(L.ts!==ts0){syncPush();return;}   // nel frattempo e' cambiato qualcosa qui: vince la modifica locale
    const m=mergeSettings(j);
    if((+j.ts||0)<(+L.ts||0)){if(m.ch.length)afterSettings(m.ch);syncPush();return;}
    const keep=RECENT,seen0=L.seen||[];let need=m.push;
    L.recent=Array.isArray(j.recent)?j.recent.slice():[];
    {const c=+getSet("rclr",0),have=new Set(L.recent.map(x=>x&&String(x.k)));   // se il server ne tiene meno, le mie locali che mancano restano (fino a RCAP)
     (keep||[]).forEach(x=>{if(x&&x.ts&&!(c&&x.ts<=c)&&!have.has(String(x.k))){L.recent.push(x);have.add(String(x.k));}});
     L.recent.sort((a,b)=>(+b.ts||0)-(+a.ts||0));if(L.recent.length>RCAP)L.recent.length=RCAP;
     if(L.recent.length>(Array.isArray(j.recent)?j.recent.length:0))need=true;}   // niente più "ripristino" cieco: un altro dispositivo che aveva svuotato non viene annullato da uno rimasto indietro
    if(Array.isArray(j.seen))L.seen=j.seen;else{L.seen=seen0;if(seen0.length)need=true;}
    if(typeof j.ts==="number")L.ts=j.ts;
    sbuild();RECENT=L.recent;pruneRecent();
    try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}
    if(m.ch.length)afterSettings(m.ch);
    if(need)lsave();
  }catch(e){}
}

/* ---------- Accesso (il dispositivo resta autorizzato) ---------- */
const AUTH_KEY="reelax_token";
const getTok=()=>{try{return localStorage.getItem(AUTH_KEY)||"";}catch(e){return "";}};
const isAuthed=()=>{
  const t=getTok();if(!t)return false;
  try{
    const p=JSON.parse(atob(t.split(".")[0].replace(/-/g,"+").replace(/_/g,"/")));
    return p.exp>Date.now();
  }catch(e){return false;}
};
const lg=$("lg");
/* onda circolare: un cerchio parte dal tasto premuto; il bordo è coperto da un anello sfumato che lo segue esattamente (stessa curva, stessa durata) */
const WAVE_E="cubic-bezier(.65,0,.25,1)",WAVE_D=950;
const WAVE_BLUR=true;   // false = niente sfocatura animata su app/form (più leggero sui telefoni lenti)
const bl=(a,b)=>WAVE_BLUR?{filter:a}:{};
const ptOf=el=>{try{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}catch(e){return{x:innerWidth/2,y:innerHeight/2};}};
const waveR=o=>Math.hypot(Math.max(o.x,innerWidth-o.x),Math.max(o.y,innerHeight-o.y))+4;
const CLIPOK=(()=>{try{return !!(window.CSS&&CSS.supports("clip-path",'path(evenodd,"M0 0H1V1H0Z")')&&CSS.supports("clip-path","circle(1px at 1px 1px)"));}catch(e){return false;}})();
function waveRing(o,R){   // anello originale: bordo rosa + bagliore viola; cresce in sincrono con il cerchio (stessa curva e durata)
  const g=document.createElement("div");
  g.style.cssText="position:fixed;z-index:301;pointer-events:none;border-radius:50%;border:3px solid #ff5a6b;box-shadow:0 0 30px #c13bd9,inset 0 0 30px rgba(193,59,217,.5);will-change:transform,opacity;left:"+o.x+"px;top:"+o.y+"px;width:"+2*R+"px;height:"+2*R+"px;transform:translate(-50%,-50%) scale(.001)";
  document.body.appendChild(g);
  const rm=()=>g.remove();
  g.animate([{transform:"translate(-50%,-50%) scale(.001)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:WAVE_D,easing:WAVE_E,fill:"forwards"}).finished.then(rm,rm);
  g.animate([{opacity:1},{opacity:1,offset:.9},{opacity:0}],{duration:WAVE_D,easing:"linear",fill:"forwards"});
  setTimeout(rm,WAVE_D+400);
}
const clearLg=()=>{try{lg.getAnimations({subtree:true}).forEach(x=>x.cancel());}catch(e){lg.getAnimations().forEach(x=>x.cancel());const f=$("lgf");if(f)f.getAnimations().forEach(x=>x.cancel());}};
const nextPaint=f=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(f,40)));   // lascia finire il lavoro pesante prima di partire
function lockApp(o,after){
  const anim=!!o&&!RM()&&!!lg.animate&&CLIPOK&&!document.body.classList.contains("locked");
  if(!anim)document.body.classList.add("locked");
  clearLg();lg.style.clipPath="";
  lg.hidden=false;lg.style.top=lg.style.bottom=lg.style.height="";
  $("lgu").value="";$("lgp").value="";$("lge").textContent="";$("lgb").disabled=false;
  const c=$("lgf");c.classList.remove("bad","busy");
  if(anim){   // logout: il login si apre come un cerchio dal tasto Esci, l'app dietro rimpicciolisce appena
    const R=waveR(o),app=$("app");
    clearLg();
    lg.style.clipPath="circle(0px at "+o.x+"px "+o.y+"px)";
    const done=()=>{document.body.classList.add("locked");clearLg();app.getAnimations().forEach(x=>x.cancel());lg.style.clipPath="";lg.style.willChange="";if(after)after();setTimeout(()=>{try{$("lgu").focus();}catch(e){}},50);};
    nextPaint(()=>{
      lg.style.willChange="clip-path";
      app.animate([{transform:"none",...bl("blur(0)")},{transform:"scale(.94)",...bl("blur(5px)")}],{duration:WAVE_D,easing:WAVE_E,fill:"forwards"});
      waveRing(o,R);
      lg.animate([{clipPath:"circle(0px at "+o.x+"px "+o.y+"px)"},{clipPath:"circle("+R+"px at "+o.x+"px "+o.y+"px)"}],{duration:WAVE_D,easing:WAVE_E,fill:"forwards"}).finished.then(done,done);
    });
    return;
  }
  if(after)after();
  if(!RM()&&lg.animate)lg.animate([{opacity:0,filter:"blur(14px)"},{opacity:1,filter:"blur(0)"}],{duration:600,easing:"cubic-bezier(.22,1,.36,1)"});
  setTimeout(()=>{try{$("lgu").focus();}catch(e){}},50);
}
function resetScroll(){try{scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;}catch(e){}}
function unlockApp(o){
  document.body.classList.remove("locked");
  try{document.activeElement&&document.activeElement.blur();}catch(e){}
  resetScroll();[100,300,600,1000].forEach(t=>setTimeout(()=>{resetScroll();fit();},t));
  routeFromHash(true);   // la pagina si costruisce SUBITO, ancora coperta dal login: durante il cerchio non resta lavoro pesante
  if(!RM()&&lg.animate&&o&&CLIPOK){   // login: un foro circolare si apre dal tasto Entra e mostra l'app
    const R=waveR(o),W=innerWidth,H=innerHeight;
    const hole=r=>"path(evenodd,'M-10 -10H"+(W+10)+"V"+(H+10)+"H-10Z M"+o.x+" "+(o.y-r)+"a"+r+" "+r+" 0 1 0 0 "+2*r+"a"+r+" "+r+" 0 1 0 0 "+(-2*r)+"Z')";
    const end=()=>{lg.hidden=true;clearLg();lg.style.clipPath="";lg.style.willChange="";};
    nextPaint(()=>{
      lg.style.willChange="clip-path";
      waveRing(o,R);
      $("lgf").animate([{transform:"none",...bl("blur(0)")},{transform:"scale(.94)",...bl("blur(5px)")}],{duration:WAVE_D,easing:WAVE_E,fill:"forwards"});
      lg.animate([{clipPath:hole(1)},{clipPath:hole(R)}],{duration:WAVE_D,easing:WAVE_E,fill:"forwards"}).finished.then(end,end);
      setTimeout(end,WAVE_D+700);
    });
    setTimeout(syncPull,WAVE_D+150);
    return;
  }
  if(!RM()&&lg.animate){lg.animate([{opacity:1,filter:"blur(0)"},{opacity:0,filter:"blur(16px)"}],{duration:600,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"}).onfinish=()=>{lg.hidden=true;clearLg();};setTimeout(()=>{lg.hidden=true;},900);}
  else lg.hidden=true;
  syncPull();
}
function resetL(){   // dopo login o logout: ricarico i dati dell'account giusto (test = vuoto, mai quelli veri)
  L=readL();RECENT=L.recent;try{sbuild();}catch(e){}
  S.seen=[];S.cands=[];setTimeout(i18nRefresh,0);
}
function doLogout(o){
  try{localStorage.removeItem(AUTH_KEY);}catch(e){}
  resetL();
  Object.assign(S,{cat:"",fmt:"",mood:"",time:"",era:"",style:"",step:0,seen:[],cands:[],cur:null,avoid:[]});
  FIRST=true;
  try{sessionStorage.removeItem("reelax_s");}catch(e){}
  CURR="";ROUTED=false;try{history.replaceState({d:0},"","#/");}catch(e){}
  lockApp(o&&typeof o.x==="number"?o:null,()=>{stage.innerHTML="";});   // con l'onda la pagina resta visibile finché il cerchio non la copre
}
let lgBusy=false;
$("lgf").addEventListener("submit",async e=>{
  e.preventDefault();if(lgBusy)return;lgBusy=true;
  const c=$("lgf"),er=$("lge"),btn=$("lgb"),org=ptOf(btn);btn.disabled=true;er.textContent="";c.classList.remove("bad");c.classList.add("busy");const t0=Date.now();
  let tok="",fail="";
  if($("lgu").value.trim()===TEST_USER&&$("lgp").value===TEST_PASS){tok=mkTestTok();}
  else try{
    const r=await fetch(TMDB_PROXY.replace(/\/+$/,"")+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("lgu").value,password:$("lgp").value})});
    if(r.ok){tok=(await r.json()).token||"";}
    else if(r.status!==401)fail="Servizio non disponibile ("+r.status+"). Riprova tra poco.";
  }catch(x){fail="Impossibile contattare il server. Controlla la connessione.";}
  await sleep(Math.max(0,1300-(Date.now()-t0)));
  lgBusy=false;
  if(tok){try{localStorage.setItem(AUTH_KEY,tok);}catch(x){}resetL();unlockApp(org);return;}
  c.classList.remove("busy");btn.disabled=false;er.textContent=fail||"Nome utente o password non corretti.";
  void c.offsetWidth;c.classList.add("bad");$("lgp").value="";try{$("lgp").focus();}catch(x){}
});
/* avvio: la schermata #sp resta finche' font e pagina sono pronti (solo da app installata: minimo 1,5 s; nel browser nessuna schermata), poi la scritta si dissolve e compare login o app */
function hideSplash(){
  const sp=$("sp");if(!sp||sp.hidden)return;
  if(RM()||!sp.animate){sp.hidden=true;return;}
  sp.classList.remove("wait");
  setTimeout(function(){   // inizio dissolvenza: sfondo pagina e colore barra tornano quelli del tema, così iOS rilegge il bordo subito
    sp.classList.add("fd");
  },260);
  const sv=sp.querySelector("svg");
  [...sp.querySelectorAll("path")].forEach((p,i)=>p.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-16px) scale(1.14)"}],{duration:520,delay:i*60,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"}));
  if(sv)sv.animate([{filter:"blur(0)"},{filter:"blur(10px)"}],{duration:700,delay:120,easing:"ease-in",fill:"forwards"});
  sp.animate([{opacity:1},{opacity:0}],{duration:560,delay:420,easing:"ease",fill:"forwards"}).onfinish=()=>{sp.hidden=true;};
  setTimeout(()=>{sp.hidden=true;},1600);
}
const boot=()=>{document.body.classList.remove("pre");try{if(!(history.state&&typeof history.state.d==="number"))history.replaceState({d:0},"");}catch(e){}if(isAuthed()){routeFromHash(true);syncPull();}else lockApp();hideSplash();};
const fontsOk=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,sleep(1200)]):Promise.resolve();
const pageOk=document.readyState==="complete"?Promise.resolve():new Promise(r=>{addEventListener("load",r,{once:true});setTimeout(r,3000);});
Promise.all([fontsOk,pageOk,0]).then(()=>requestAnimationFrame(()=>requestAnimationFrame(boot)));
/* aggiornamento live: tornando sull'app (o ogni minuto) si leggono le impostazioni dagli altri dispositivi */
let lastPull=Date.now();
const livePull=()=>{if(document.hidden||document.body.classList.contains("locked")||!isAuthed()||Date.now()-lastPull<15000)return;lastPull=Date.now();syncPull();};
document.addEventListener("visibilitychange",livePull);addEventListener("focus",livePull);setInterval(livePull,60000);

try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;if(ios&&!stand&&!localStorage.getItem("stasera_ix")){ib.querySelector("p").innerHTML="Per usarla come app: tocca <b>Condividi</b> ⬆️ e poi <b>Aggiungi a Home</b>.";$("ibtn").hidden=true;ib.hidden=false;}}catch(e){}

<script>
/* scorciatoie da tastiera (desktop): ← indietro, → / Invio prossimo, Esc chiude la locandina */
addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target,tag=t&&t.tagName;if(tag==="INPUT"||tag==="TEXTAREA")return;
  var lb=document.getElementById("lb");
  if(e.key==="Escape"&&lb&&lb.classList.contains("on")){var x=document.getElementById("lbx");if(x)x.click();return;}
  if(document.body.classList.contains("locked")||(lb&&lb.classList.contains("on")))return;
  var k=e.key,sel=null;
  if(k==="ArrowLeft"||k==="Backspace")sel='#tl [data-act="back"]';
  else if(k==="ArrowRight")sel='#dockin [data-act="oth"]';
  if(sel){var b=document.querySelector(sel);if(b){e.preventDefault();b.click();}}
});
</script>
<script>
/* aggiornamento automatico: confronta la pagina in uso con quella appena pubblicata e, se è cambiata, si ricarica da sola (senza cache) */
(function(){
  var HREF=location.pathname+location.search,G="rx_upd_g",busy=false;
  try{if(/[?&]v=/.test(location.search))history.replaceState(history.state,"",location.pathname+location.hash);}catch(e){}   // tolgo il parametro dall'indirizzo
  function h(t){var x=2166136261;for(var i=0;i<t.length;i++){x^=t.charCodeAt(i);x=Math.imul(x,16777619);}return (x>>>0).toString(36)+"-"+t.length;}
  function get(url,opt){return fetch(url,opt).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){if(t.indexOf("<html")<0)throw 0;return t;});}
  function check(){
    if(busy||navigator.onLine===false)return;busy=true;
    Promise.all([
      get(HREF,{cache:"force-cache"}).then(h).catch(function(){return null;}),     // la pagina che sto usando (copia in cache)
      get(location.pathname+"?_="+Date.now(),{cache:"no-store"}).then(function(t){return h(t);})   // quella appena pubblicata
    ]).then(function(r){
      var own=r[0],fresh=r[1];
      if(!own||own===fresh)return;
      try{if(sessionStorage.getItem(G)===fresh)return;}catch(e){}   // già provato: niente cicli
      var a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;   // non interrompo chi sta scrivendo
      try{sessionStorage.setItem(G,fresh);}catch(e){}
      location.replace(location.pathname+"?v="+fresh+location.hash);
    }).catch(function(){}).then(function(){busy=false;});
  }
  check();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)check();});
  addEventListener("online",check);addEventListener("focus",check);
  setInterval(check,180000);
  if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});   // avvio rapido e uso offline
})();
</script>
